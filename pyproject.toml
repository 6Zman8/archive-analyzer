[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-analyzer"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "Pillow>=11",
    "pywin32>=311; sys_platform == 'win32'",
    "numpy>=2.1,<3",
    "rapidocr==3.9.2",
    "onnxruntime==1.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-timeout>=2.3", "PyInstaller>=6.18,<7"]

[project.scripts]
archive-analyzer = "archive_analyzer.cli:main"

[project.gui-scripts]
archive-analyzer-gui = "archive_analyzer.desktop:main"

[tool.setuptools.package-data]
archive_analyzer = ["storage/migrations/*.sql"]

[tool.setuptools.dynamic]
version = {attr = "archive_analyzer.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra -m "not packaged"'
markers = [
    "packaged: requires a freshly built Windows executable and is deselected by default",
]
